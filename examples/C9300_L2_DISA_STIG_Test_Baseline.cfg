!
! Cisco Catalyst C9300-24T-E
! Illustrative Layer-2 access switch baseline for DISA Cisco IOS XE Switch L2S STIG v3r2
! Target train: IOS XE 17.18.x (verify exact image/model support before deployment)
! NOT a certified or universally compliant configuration.
!
! Replace every <PLACEHOLDER>. Do not deploy unchanged.
!
version 17.18
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service sequence-numbers
no service pad
no ip domain-lookup
!
hostname DOD-ACC-SW01
!
enable secret <UNIQUE_ENABLE_SECRET>
username netadmin privilege 15 secret <UNIQUE_LOCAL_BREAKGLASS_SECRET>
!
aaa new-model
!
tacacs server TACACS01
 address ipv4 192.0.2.10
 key <TACACS_SHARED_SECRET>
 timeout 5
!
aaa group server tacacs+ TACACS-GROUP
 server name TACACS01
!
aaa authentication login default group TACACS-GROUP local
aaa authentication enable default group TACACS-GROUP enable
aaa authorization exec default group TACACS-GROUP local if-authenticated
aaa authorization commands 15 default group TACACS-GROUP local if-authenticated
aaa accounting exec default start-stop group TACACS-GROUP
aaa accounting commands 15 default start-stop group TACACS-GROUP
aaa accounting system default start-stop group TACACS-GROUP
!
ip domain name example.mil
ip name-server 192.0.2.53
!
! Generate the RSA key interactively after loading: crypto key generate rsa modulus 3072
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
login block-for 900 attempts 3 within 60
login on-failure log
login on-success log
security passwords min-length 15
!
banner motd ^C
************************************************************************
* WARNING: This is a U.S. Government information system.               *
* Unauthorized access is prohibited and may be subject to prosecution. *
* Use is restricted to authorized personnel.                            *
************************************************************************
^C
!
clock timezone EST -5 0
ntp server 192.0.2.20 prefer
ntp server 192.0.2.21
!
service tcp-keepalives-in
service tcp-keepalives-out
!
no ip http server
no ip http secure-server
no ip source-route
no ip bootp server
no ip domain-lookup
!
no cdp run
lldp run
!
vtp domain EXAMPLE-MIL
vtp version 3
vtp mode transparent
vtp password <VTP_AUTHENTICATION_SECRET>
!
spanning-tree mode rapid-pvst
spanning-tree loopguard default
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
vlan 10
 name USER-DATA
!
vlan 20
 name VOICE
!
vlan 30
 name PRINTERS
!
vlan 99
 name SWITCH-MGMT
!
vlan 998
 name NATIVE-BLACKHOLE
!
vlan 999
 name UNUSED-PORTS
!
ip default-gateway 192.0.2.1
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan99
 description OOB-IN-BAND-MANAGEMENT
 ip address 192.0.2.11 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
!
ip access-list standard MGMT-SOURCES
 permit 192.0.2.0 0.0.0.255
 deny any log
!
ip access-list extended NTP-AND-MGMT-PLANE
 permit udp host 192.0.2.20 any eq ntp
 permit udp host 192.0.2.21 any eq ntp
 deny ip any any log
!
line console 0
 exec-timeout 5 0
 logging synchronous
 login authentication default
!
line vty 0 15
 access-class MGMT-SOURCES in
 exec-timeout 5 0
 transport input ssh
 transport output none
 login authentication default
!
no ip http server
no ip http secure-server
!
snmp-server group NMS-GROUP v3 priv
snmp-server user NMS-USER NMS-GROUP v3 auth sha <SNMP_AUTH_SECRET> priv aes 128 <SNMP_PRIV_SECRET>
snmp-server host 192.0.2.30 version 3 priv NMS-USER
snmp-server enable traps
snmp-server location <SITE-BUILDING-RACK>
snmp-server contact <NETWORK-OPERATIONS-CONTACT>
!
logging buffered 64000 informational
logging host 192.0.2.40 transport tcp port 6514
logging trap informational
logging source-interface Vlan99
logging origin-id hostname
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
ip dhcp snooping information option
!
ip arp inspection vlan 10,20,30
!
ip igmp snooping
ip igmp snooping vlan 10
ip igmp snooping vlan 20
ip igmp snooping vlan 30
!
dot1x system-auth-control
!
errdisable recovery cause bpduguard
errdisable recovery cause storm-control
errdisable recovery interval 300
!
udld aggressive
!
interface range GigabitEthernet1/0/1-20
 description USER-EDGE-PORTS
 switchport
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 1.00
 storm-control multicast level 1.00
 storm-control unicast level 1.00
 switchport block unicast
 authentication port-control auto
 authentication order dot1x mab
 authentication priority dot1x mab
 authentication host-mode single-host
 authentication violation restrict
 dot1x pae authenticator
 ip dhcp snooping limit rate 15
 ip verify source
 no shutdown
!
interface range GigabitEthernet1/0/21-22
 description UNUSED-ADMIN-DISABLED
 switchport
 switchport mode access
 switchport access vlan 999
 switchport nonegotiate
 shutdown
!
interface GigabitEthernet1/0/23
 description UPLINK-TO-DISTRIBUTION-A
 switchport
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 998
 switchport trunk allowed vlan 10,20,30,99,998
 ip dhcp snooping trust
 ip arp inspection trust
 udld port aggressive
 no shutdown
!
interface GigabitEthernet1/0/24
 description DOWNLINK-TO-ACCESS-SWITCH
 switchport
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 998
 switchport trunk allowed vlan 10,20,30,998
 spanning-tree guard root
 udld port aggressive
 no shutdown
!
no ip routing
!
end
